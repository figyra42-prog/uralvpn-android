name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - xray-proto

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i 's/^    compileSdk = 37$/    compileSdk = 37\n    ndkVersion = "30.0.16248370"/' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest

    - name: Download flag assets
      run: |
        FLAGS=$(mktemp -d)
        git -C "$FLAGS" init -q
        git -C "$FLAGS" remote add origin https://github.com/googlefonts/noto-emoji
        git -C "$FLAGS" fetch -q --depth 1 --filter=blob:none origin 99701e07d3d1fe1bdbcdb14964547f0fd592966f
        git -C "$FLAGS" checkout -q FETCH_HEAD -- third_party/region-flags/png
        DST="${{ github.workspace }}/V2rayNG/app/src/main/res/drawable-nodpi"
        mkdir -p "$DST"
        for file in "$FLAGS"/third_party/region-flags/png/*.png; do
          name=$(basename "$file" .png)
          case "$name" in
            [A-Z][A-Z]) cp "$file" "$DST/flag_$(echo "$name" | tr 'A-Z' 'a-z').png" ;;
          esac
        done
        COUNT=$(find "$DST" -name 'flag_*.png' | wc -l)
        echo "flags: $COUNT"
        test "$COUNT" -gt 200
        rm -rf "$FLAGS"

    - name: Build APK (debug)
      env:
        KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > app/release.keystore
          echo "signing: production key"
        else
          cp app/keystore/uralvpn-release.p12 app/release.keystore
          KS_PASS=uralvpn; KS_ALIAS=uralvpn; KS_KEY_PASS=uralvpn
          echo "signing: committed beta key (secrets not set)"
        fi
        {
          echo "KEYSTORE_PASS=$KS_PASS"
          echo "ALIAS_NAME=$KS_ALIAS"
          echo "ALIAS_PASS=$KS_KEY_PASS"
        } >> local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreDebug
    
    - name: Draft release with APK
      if: ${{ success() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        D=$(dirname "$(ls ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*arm64-v8a*.apk | head -1)")
        ls -l "$D"
        cp "$D"/*arm64-v8a*.apk UralVPN-Xray-arm64-v8a.apk
        ASSETS="UralVPN-Xray-arm64-v8a.apk"
        if ls "$D"/*universal*.apk >/dev/null 2>&1; then
          cp "$D"/*universal*.apk UralVPN-Xray-universal.apk
          ASSETS="$ASSETS UralVPN-Xray-universal.apk"
        fi
        gh release create "xray-proto-${{ github.run_number }}-${{ github.run_attempt }}" $ASSETS \
          --draft --prerelease --target "${{ github.sha }}" \
          --title "UralVPN Xray prototype #${{ github.run_number }}" \
          --notes "Тестовая сборка прототипа UralVPN на Xray. Пакет app.uralvpn.xray, ставится рядом с UralVPN. Добавьте подписку и сравните с основным приложением."

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
