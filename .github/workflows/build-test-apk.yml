name: Build test APK (XHTTP body-uplink fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout core (with fix)
        uses: actions/checkout@v4
        with:
          repository: figyra42-prog/uralvpn-core
          ref: fix-xhttp-body-uplink
          path: sing-box-core
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null 2>&1 || true
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1)
          if [ -z "$NDK" ]; then
            "$SDKMGR" "ndk;27.0.12077973" > /dev/null 2>&1 || true
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1)
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME | NDK: $NDK"

      - name: Install gomobile (sagernet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox.aar
        working-directory: sing-box-core
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind \
            -target=android/arm64 \
            -androidapi=24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -o libbox.aar \
            -trimpath \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.15.0-alpha.13 -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -tags "with_quic,with_wireguard,with_utls,with_clash_api,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird" \
            ./experimental/libbox

      - name: Copy libbox.aar to app
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box-core/libbox.aar sing-box-for-android/app/libs/libbox.aar

      - name: Build APK
        working-directory: sing-box-for-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uralvpn-test-apk
          path: sing-box-for-android/app/build/outputs/apk/play/debug/*.apk
