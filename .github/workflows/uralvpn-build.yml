name: UralVPN build
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Put the APKs into a draft release (visible to the repo owner only)'
        type: boolean
        default: false
      public_release:
        description: 'PUBLIC release: everybody sees it, the app updates itself from it'
        type: boolean
        default: false
  push:
    branches: [uralvpn]
    paths-ignore: ['.github/workflows/uralvpn-verify.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VER: 28.0.13004108
    steps:
      - uses: actions/checkout@v5
        with:
          path: sing-box-for-android
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: figyra42-prog/uralvpn-core
          ref: uralvpn
          path: sing-box
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: figyra42-prog/uralvpn-app
          ref: master
          path: uralvpn-app
          sparse-checkout: V2rayNG/app/src/main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;$NDK_VER" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum
      - name: Core revision
        id: core
        run: echo "sha=$(git -C sing-box rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache libbox
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: sing-box-for-android/app/libs
          key: libbox-arm-gvisor-${{ steps.core.outputs.sha }}-${{ hashFiles('sing-box-for-android/.github/workflows/uralvpn-build.yml', 'sing-box-for-android/.github/uralvpn/patch_urltest.py') }}
      - name: Build libbox from uralvpn-core
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          export GOTOOLCHAIN=local
          export CGO_LDFLAGS_ALLOW='-l:libcronet\.a'
          mkdir -p ../sing-box-for-android/app/libs
          # UralVPN: xhttp small scMaxEachPostBytes as in Xray-core (panel CDN hosts use 1536-6144)
          python3 .github/e2e/patch_xhttp.py transport/v2rayxhttp/client.go
          # UralVPN: a failed ping test is repeated once (own 6 s limit per try)
          python3 ../sing-box-for-android/.github/uralvpn/patch_urltest.py protocol/group/urltest.go
          # UralVPN: TUN stack gVisor is required by panel configs (stack: gvisor / mixed)
          sed -i 's/sharedTags = append(sharedTags, "with_quic",/sharedTags = append(sharedTags, "with_gvisor", "with_quic",/' cmd/internal/build_libbox/main.go
          grep -n 'with_gvisor' cmd/internal/build_libbox/main.go
          make lib_install
          go run ./cmd/internal/build_libbox -target android -platform android/arm64,android/arm
          ls -la ../sing-box-for-android/app/libs
      - name: Version
        id: ver
        working-directory: sing-box-for-android
        run: |
          # UralVPN: own version that grows with every build (the update check compares them)
          CODE=$((1000 + ${{ github.run_number }}))
          NAME="1.0.${{ github.run_number }}"
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$CODE/; s/^VERSION_NAME=.*/VERSION_NAME=$NAME/" version.properties
          cat version.properties
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Apply UralVPN branding
        run: |
          bash sing-box-for-android/.github/uralvpn/brand.sh uralvpn-app/V2rayNG/app/src/main sing-box-for-android
          python3 -I sing-box-for-android/.github/uralvpn/patch_release.py sing-box-for-android
      - name: Build APK
        working-directory: sing-box-for-android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # UralVPN: the permanent signing key (repository secrets); a release build needs it
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$KS_PASS"
            echo "ALIAS_NAME=$KS_ALIAS"
            echo "ALIAS_PASS=$KS_KEY_PASS"
          } >> local.properties
          echo "signing: permanent key"
          ./gradlew --no-daemon :app:assembleOtherRelease
          echo "{\"version_code\": ${{ steps.ver.outputs.code }}}" > SFA-version-metadata.json
          ls -l app/build/outputs/apk/other/release/
      - uses: actions/upload-artifact@v5
        with:
          name: uralvpn-android-apk
          path: sing-box-for-android/app/build/outputs/apk/other/release/*.apk
      - name: Draft release with the APK
        if: ${{ inputs.draft_release && !inputs.public_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: sing-box-for-android
        run: |
          D=app/build/outputs/apk/other/release
          cp "$D"/*universal*.apk "$D/UralVPN-universal.apk"
          cp "$D"/*arm64-v8a*.apk "$D/UralVPN-arm64-v8a.apk"
          gh release create "draft-${{ github.run_number }}" "$D/UralVPN-universal.apk" "$D/UralVPN-arm64-v8a.apk" SFA-version-metadata.json \
            --draft --prerelease --target "${{ github.sha }}" \
            --title "UralVPN test build #${{ github.run_number }} (${{ steps.ver.outputs.name }})" \
            --notes "Test build ${{ github.sha }}. Release build (R8), not for public distribution."
      - name: Public release with the APK
        if: ${{ inputs.public_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: sing-box-for-android
        run: |
          D=app/build/outputs/apk/other/release
          cp "$D"/*universal*.apk "$D/UralVPN-universal.apk"
          cp "$D"/*arm64-v8a*.apk "$D/UralVPN-arm64-v8a.apk"
          gh release create "v${{ steps.ver.outputs.name }}" "$D/UralVPN-universal.apk" "$D/UralVPN-arm64-v8a.apk" SFA-version-metadata.json \
            --latest --target "${{ github.sha }}" \
            --title "UralVPN ${{ steps.ver.outputs.name }}" \
            --notes "UralVPN ${{ steps.ver.outputs.name }}. Installs over the previous version; take the universal APK if you are not sure which one fits. The app checks for updates itself (Settings -> App)."
